              - paragraph [ref=f5e187]: A legal-reasoning assistant for Indian jurisprudence that answers a question of law with the statute or precedent it relied on, and that says it does not know rather than inventing a citation. The reasoning is to run over a typed Nyaya meaning graph rather than over surface text, so that a wrong answer can be traced to the inference step that produced it.
