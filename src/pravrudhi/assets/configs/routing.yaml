# What each route costs and what it can do, as far as this project has measured it.
#
# Relative cost is per input token, normalised so the cheapest available route is 1.0. It is a ratio rather than a
# price because prices change and ratios move more slowly; a route's absolute bill is not something this repository
# can observe. Update these when the provider's rate card changes, and record the date.
#
# `agent` and `model` are the pair the agent registry understands. `tiers` names the difficulty tiers a route is
# permitted to serve at all; the router chooses among permitted routes by measured outcome, never outside them.
updated: 2026-09-05
minimum_trials: 3          # below this a route has no measured record and the declared order decides
confidence: 0.95           # interval used when asking whether one route is distinguishably worse than another

routes:
  - id: astra
    agent: codex
    model: gpt-6-astra
    relative_cost: 10.0
    tiers: [critical, design, standard, mechanical]
    note: >-
      The strongest available and the most expensive. Twenty sessions in one day consumed seven million input
      tokens while it was the silent default for three of the four tiers.

  - id: astra-mini
    agent: codex
    model: gpt-6-astra-mini
    relative_cost: 1.0
    tiers: [mechanical, standard]

  - id: gpt6-mini
    agent: codex
    model: gpt-6-mini
    relative_cost: 1.5
    tiers: [mechanical, standard, design]

  - id: sonnet
    agent: claude-code
    model: sonnet
    relative_cost: 4.0
    tiers: [design, standard, critical]

  - id: local-glm
    agent: orca:local
    model: glm-4.7-flash
    relative_cost: 0.0
    tiers: []
    note: >-
      Costs nothing and, on this evidence, does nothing: it produced no change at all on two tasks a hosted agent
      completed in minutes. Serving text and driving an agentic tool-calling loop are different capabilities.
      Permitted at no tier until that is disproved by a trial, which the router will never run on its own.

# Declared preference per tier, used until a route has `minimum_trials` outcomes at that tier. Ordered cheapest
# first among routes believed capable, which is a guess and is labelled as one.
declared:
  mechanical: [astra-mini, gpt6-mini, astra]
  standard: [gpt6-mini, astra-mini, sonnet, astra]
  design: [sonnet, gpt6-mini, astra]
  critical: [astra, sonnet]
